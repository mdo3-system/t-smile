    <section id="admin" class="page-section" data-deferred-template="tmpl-admin"></section>
    <template id="tmpl-admin">
      <div class="hero">
        <span class="hero-tag">管理者・チーフ建築士専用ポータル</span>
        <h2 class="hero-title">社内統合管理コンソール<br><span style="color: #38bdf8; font-size: 1.6rem;">施主CRM連動 ＆ 間取りライブラリ・スケール正規化インポーター</span></h2>
        <p class="hero-subtitle">登録されたお施主様のマイページ情報・展示場予約の管理と、AI間取り選別スタジオで提供する間取り図ライブラリ（自社図面＋X投稿・海外カタログ等の外部取込）の統合管理を行えます。</p>
      </div>

      <!-- Admin Tab Controls -->
      <div style="display: flex; gap: 12px; margin-bottom: 2rem; border-bottom: 2px solid #334155; padding-bottom: 0.8rem;">
        <button type="button" id="admin-tab-users" class="btn btn-primary" style="font-size: 0.95rem;">
          👥 施主カルテ ＆ CRMワンタップ同期
        </button>
        <button type="button" id="admin-tab-plans" class="btn btn-secondary" style="font-size: 0.95rem;">
          📂 間取りライブラリ管理 ＆ 外部図面インポーター
        </button>
      </div>

      <!-- Tab 1: Users & CRM List -->
      <div id="admin-view-users">
        <div id="admin-users-list"></div>
      </div>

      <!-- Tab 2: Floorplan Library & Importer -->
      <div id="admin-view-plans" style="display: none;">
        
        <!-- Importer Form Box -->
        <div class="card" style="background: #ffffff; border: 2px solid #0284c7; border-radius: var(--radius-lg); padding: 1.8rem; margin-bottom: 2.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.8rem; margin-bottom: 1.2rem;">
            <h3 style="color: #0369a1; font-family: var(--font-heading); font-size: 1.25rem; margin: 0;">
              📥 外部図面（X投稿・海外カタログ等）取込 ＆ スケール正規化
            </h3>
            <span style="background: #e0f2fe; color: #0284c7; font-size: 0.8rem; font-weight: 800; padding: 4px 10px; border-radius: 12px;">
              ミリ単位・壁厚130mm自動統一
            </span>
          </div>

          <form id="admin-plan-import-form">
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">プラン名称・タイトル</label>
                <input type="text" id="imp-title" class="form-input" placeholder="例: X投稿共有: 中庭テラスを囲む回遊動線の平屋" required />
              </div>
              <div class="form-group">
                <label class="form-label">階数</label>
                <select id="imp-stories" class="form-select">
                  <option value="1">平屋 (1階建て)</option>
                  <option value="2">2階建て</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">延床面積（㎡）</label>
                <input type="number" id="imp-area-sqm" class="form-input" step="0.1" placeholder="例: 92.5" required />
              </div>
              <div class="form-group">
                <label class="form-label">坪数（坪）</label>
                <input type="number" id="imp-tsubo" class="form-input" step="0.1" placeholder="例: 28.0" required />
              </div>
              <div class="form-group">
                <label class="form-label">間取りタイプ（部屋数）</label>
                <input type="text" id="imp-rooms" class="form-input" placeholder="例: 3LDK+パントリー" required />
              </div>
              <div class="form-group">
                <label class="form-label">ターゲット家族構成</label>
                <select id="imp-family" class="form-select">
                  <option value="子育て3〜4人">子育て3〜4人</option>
                  <option value="夫婦・単身">夫婦・単身</option>
                  <option value="二世帯・同居">二世帯・同居</option>
                </select>
              </div>
            </div>

            <div class="grid-2" style="margin-top: 1rem;">
              <div class="form-group">
                <label class="form-label">スケール正規化モジュール設定</label>
                <select id="imp-module" class="form-select">
                  <option value="910">尺モジュール (910mmグリッド基準)</option>
                  <option value="1000">メーターモジュール (1000mmグリッド基準)</option>
                  <option value="auto">AIスケール自動検出 (寸法線・文字認識で正規化)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">図面取込元ソース</label>
                <select id="imp-source" class="form-select">
                  <option value="自社既存顧客図面">自社既存顧客図面</option>
                  <option value="X(旧Twitter)1日1プラン投稿者">X(旧Twitter)1日1プラン投稿者</option>
                  <option value="海外カタログスキャン">海外カタログスキャン</option>
                  <option value="その他建築設計資料">その他建築設計資料</option>
                </select>
              </div>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
              <label class="form-label">こだわり特徴タグ（カンマ区切り）</label>
              <input type="text" id="imp-features" class="form-input" placeholder="例: 中庭テラス, パントリー, 回遊動線, ファミリークローゼット" />
            </div>

            <div class="form-group" style="margin-top: 1rem;">
              <label class="form-label">プランの特徴・おすすめ解説文</label>
              <textarea id="imp-desc" class="form-textarea" rows="3" placeholder="プランの魅力や動線設計の意図を入力"></textarea>
            </div>

            <div style="text-align: right; margin-top: 1.5rem;">
              <button type="submit" class="btn btn-primary" style="background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; padding: 0.8rem 2rem;">
                ➕ スケールを正規化して間取りライブラリに登録する
              </button>
            </div>
          </form>
        </div>

        <!-- Stored Floor Plans List -->
        <div>
          <h3 style="color: #f8fafc; font-family: var(--font-heading); font-size: 1.35rem; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between;">
            <span>📋 登録済み間取りライブラリ一覧 (<span id="admin-plans-count">30</span>プラン蓄積中)</span>
            <span style="font-size: 0.85rem; color: #94a3b8; font-weight: normal;">※AI間取り選別スタジオで常時提供中</span>
          </h3>
          <div id="admin-plans-table-container" style="background: #ffffff; border-radius: var(--radius-md); overflow-x: auto; box-shadow: var(--shadow-card);">
            <!-- Dynamically populated table of floor plans -->
          </div>
        </div>

      </div>
    </template>
